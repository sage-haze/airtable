<!DOCTYPE html>
<html>
  <head>
    <title>Airtable Student Updates</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 900px;
        margin: 40px auto;
        padding: 0 20px;
        background: #f7f7f7;
      }

      h1 {
        margin-bottom: 24px;
      }

      .record {
        background: white;
        border: 1px solid #ddd;
        border-radius: 10px;
        padding: 20px;
        margin-bottom: 16px;
      }

      .student-name {
        font-size: 22px;
        font-weight: bold;
        margin-bottom: 8px;
      }

      .module {
        color: #555;
        margin-bottom: 16px;
      }

      .field {
        margin-top: 14px;
      }

      .field-label {
        font-weight: bold;
        margin-bottom: 4px;
      }

      .empty {
        color: #999;
        font-style: italic;
      }
    </style>
  </head>

  <body>
    <h1>Student Updates</h1>
    <div id="records">Loading Airtable data...</div>

    <script>
      const fieldsToDisplay = [
        "student_full_name",
        "Module",
        "Summary",
        "Tasks Assigned",
        "What we'll cover next time",
      ];

      function formatValue(value) {
        if (value === undefined || value === null || value === "") {
          return '<span class="empty">Not provided</span>';
        }

        if (Array.isArray(value)) {
          return value.join(", ");
        }

        if (typeof value === "object") {
          return JSON.stringify(value, null, 2);
        }

        return String(value).replace(/\n/g, "<br>");
      }

      async function loadAirtable() {
        const container = document.getElementById("records");

        try {
          const res = await fetch("/api/airtable");
          const data = await res.json();

          if (!res.ok) {
            container.innerHTML = `
              <div class="record">
                <strong>Error loading Airtable data</strong>
                <pre>${JSON.stringify(data, null, 2)}</pre>
              </div>
            `;
            return;
          }

          if (!data.records || data.records.length === 0) {
            container.innerHTML = '<p class="empty">No records found.</p>';
            return;
          }

          container.innerHTML = data.records
            .map((record) => {
              const fields = record.fields;

              return `
                <div class="record">
                  <div class="student-name">
                    ${formatValue(fields["student_full_name"])}
                  </div>

                  <div class="module">
                    Module: ${formatValue(fields["Module"])}
                  </div>

                  <div class="field">
                    <div class="field-label">Summary</div>
                    <div>${formatValue(fields["Summary"])}</div>
                  </div>

                  <div class="field">
                    <div class="field-label">Tasks Assigned</div>
                    <div>${formatValue(fields["Tasks Assigned"])}</div>
                  </div>

                  <div class="field">
                    <div class="field-label">What we'll cover next time</div>
                    <div>${formatValue(fields["What we'll cover next time"])}</div>
                  </div>
                </div>
              `;
            })
            .join("");
        } catch (error) {
          container.innerHTML = `
            <div class="record">
              <strong>Something went wrong</strong>
              <p>${error.message}</p>
            </div>
          `;
        }
      }

      loadAirtable();
    </script>
  </body>
</html>
