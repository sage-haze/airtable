<!DOCTYPE html>
<html>
  <head>
    <title>Airtable Student Updates</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        max-width: 100%;
        margin: 40px auto;
        padding: 0 20px;
        background: #f7f7f7;
        color: #111827;
      }

      h1 {
        margin-bottom: 8px;
      }

      .subtitle {
        color: #6b7280;
        margin-bottom: 24px;
      }

      .top-row {
        display: flex;
        justify-content: flex-start;
        align-items: flex-start;
        gap: 24px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }

      .page-heading {
        flex: 0 0 auto;
        min-width: 260px;
      }

      .filter-bar {
        display: inline-block;
        background: white;
        border: 1px solid #ddd;
        border-radius: 10px;
        padding: 16px;
        margin-bottom: 20px;
        width: fit-content;
        max-width: 100%;
      }

      
      .shortcuts-box {
        flex: 0 1 520px;
        margin-bottom: 0;
        margin-top: 2px;
      }

      .shortcuts-links {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .shortcuts-links a {
        text-decoration: none;
        color: #2563eb;
        background: #eff6ff;
        border: 1px solid #bfdbfe;
        padding: 8px 12px;
        border-radius: 8px;
        font-size: 14px;
      }

      .shortcuts-links a:hover {
        background: #dbeafe;
      }

      label {
        display: block;
        font-weight: bold;
        margin-bottom: 8px;
      }

      select {
        width: 280px;
        max-width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 16px;
        background: white;
      }

      .records-container {
        display: flex;
        flex-wrap: nowrap;
        gap: 20px;
        overflow-x: scroll;
        overflow-y: visible;
        width: 100%;
        max-width: 100vw;
        padding: 4px 4px 26px;
        align-items: flex-start;
        scroll-snap-type: x proximity;
        scrollbar-gutter: stable;
        scrollbar-width: auto;
        cursor: grab;
      }

      .records-container:active {
        cursor: grabbing;
      }

      .records-container::-webkit-scrollbar {
        height: 14px;
      }

      .records-container::-webkit-scrollbar-track {
        background: #e5e7eb;
        border-radius: 999px;
      }

      .records-container::-webkit-scrollbar-thumb {
        background: #9ca3af;
        border-radius: 999px;
        border: 3px solid #e5e7eb;
      }

      .scroll-hint {
        color: #6b7280;
        font-size: 14px;
        margin: 0 0 10px 2px;
      }

      .record {
        background: white;
        border: 1px solid #ddd;
        border-radius: 14px;
        padding: 20px;
        flex: 0 0 420px;
        max-width: 420px;
        min-width: 0;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        overflow-wrap: anywhere;
        word-break: break-word;
        scroll-snap-align: start;
      }

      .record-header {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 16px;
      }

      .header-main {
        min-width: 0;
      }

      .type-pill {
        display: inline-block;
        padding: 6px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        background: #e0e7ff;
        color: #3730a3;
        margin-bottom: 10px;
        max-width: 100%;
        overflow-wrap: anywhere;
      }

      .module-title {
        font-size: 24px;
        font-weight: 700;
        line-height: 1.2;
      }

      .meta-right {
        flex: 0 0 auto;
        text-align: right;
        color: #4b5563;
        font-size: 14px;
        line-height: 1.5;
        white-space: nowrap;
      }

      .field {
        margin-top: 14px;
      }

      .field-label {
        font-weight: 700;
        margin-bottom: 6px;
      }

      .student-name {
        display: inline-block;
        margin-top: 8px;
        font-size: 14px;
        font-weight: 700;
        color: #374151;
      }

      label {
        font-weight: bold;
        margin-bottom: 4px;
      }

      .rich-text,
      .rich-text * {
        max-width: 100%;
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .rich-text p {
        margin: 6px 0;
        line-height: 1.6;
      }

      .rich-text ul {
        margin: 8px 0;
        padding-left: 22px;
      }

      .rich-text li {
        margin: 4px 0;
        line-height: 1.5;
      }

      .rich-text h2,
      .rich-text h3,
      .rich-text h4 {
        margin: 10px 0 6px;
      }

      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .empty {
        color: #999;
        font-style: italic;
      }

      @media (max-width: 760px) {
        .top-row {
          flex-direction: column;
        }

        .shortcuts-box {
          width: 100%;
        }

        .page-heading {
          min-width: 0;
        }
      }

      @media (max-width: 520px) {
        .record {
          flex-basis: 86vw;
          max-width: 86vw;
        }

        .record-header {
          flex-direction: column;
        }

        .meta-right {
          text-align: left;
        }
      }
    </style>
  </head>

  <body>
    <div class="top-row">
      <div class="page-heading">
        <h1>Student Updates</h1>
        <p class="subtitle">Select a student to view their Airtable records.</p>
      </div>

      <div class="filter-bar shortcuts-box">
        <label>Helpful shortcuts</label>
        <div class="shortcuts-links">
          <a href="https://portal.ivyprep.com.sg/" target="_blank">Airtable Portal</a>
          <a href="https://docs.google.com/spreadsheets/d/1P_2A43kCkBhTubo-WtRHR_oWg5C1YcofikC8p4i4nf4/edit?gid=408820543#gid=408820543" target="_blank">Sessions overview</a>
          <a href="https://docs.google.com/spreadsheets/d/1VU8fyN67q6xr-m8VngIzkHPs2lsiRB5jNH0Kc2ZU8Bw/edit?gid=0#gid=0" target="_blank">Session Summary</a>
        </div>
      </div>
    </div>

    <div class="filter-bar">
      <label for="studentFilter">Filter by student</label>
      <select id="studentFilter" disabled>
        <option>Loading students...</option>
      </select>
    </div>

    <div id="records">Loading Airtable data...</div>

    <script src="scripts/script.js"></script>
  </body>
</html>
