<!DOCTYPE html>
<html>
  <head>
    <title>Airtable Student Updates</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        max-width: 100%;
        margin: 40px auto;
        padding: 0 20px;
        background: #f7f7f7;
        color: #111827;
      }

      h1 {
        margin-bottom: 8px;
      }

      .subtitle {
        color: #6b7280;
        margin-bottom: 24px;
      }

      .filter-bar {
        background: white;
        border: 1px solid #ddd;
        border-radius: 10px;
        padding: 16px;
        margin-bottom: 20px;
        width: fit-content;
        max-width: 100%;
      }

      label {
        display: block;
        font-weight: bold;
        margin-bottom: 8px;
      }

      select {
        width: 280px;
        max-width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 16px;
        background: white;
      }

      .records-container {
        display: flex;
        flex-wrap: nowrap;
        gap: 20px;
        overflow-x: auto;
        overflow-y: visible;
        width: 100%;
        max-width: 100%;
        padding: 4px 4px 20px;
        align-items: flex-start;
        scroll-snap-type: x proximity;
      }

      .record {
        background: white;
        border: 1px solid #ddd;
        border-radius: 14px;
        padding: 20px;
        flex: 0 0 420px;
        max-width: 420px;
        min-width: 0;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        overflow-wrap: anywhere;
        word-break: break-word;
        scroll-snap-align: start;
      }

      .record-header {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 16px;
      }

      .header-main {
        min-width: 0;
      }

      .type-pill {
        display: inline-block;
        padding: 6px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        background: #e0e7ff;
        color: #3730a3;
        margin-bottom: 10px;
        max-width: 100%;
        overflow-wrap: anywhere;
      }

      .module-title {
        font-size: 24px;
        font-weight: 700;
        line-height: 1.2;
      }

      .meta-right {
        flex: 0 0 auto;
        text-align: right;
        color: #4b5563;
        font-size: 14px;
        line-height: 1.5;
        white-space: nowrap;
      }

      .field {
        margin-top: 14px;
      }

      .field-label {
        font-weight: bold;
        margin-bottom: 4px;
      }

      .rich-text,
      .rich-text * {
        max-width: 100%;
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .rich-text p {
        margin: 6px 0;
        line-height: 1.6;
      }

      .rich-text ul {
        margin: 8px 0;
        padding-left: 22px;
      }

      .rich-text li {
        margin: 4px 0;
        line-height: 1.5;
      }

      .rich-text h2,
      .rich-text h3,
      .rich-text h4 {
        margin: 10px 0 6px;
      }

      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .empty {
        color: #999;
        font-style: italic;
      }

      @media (max-width: 520px) {
        .record {
          flex-basis: 86vw;
          max-width: 86vw;
        }

        .record-header {
          flex-direction: column;
        }

        .meta-right {
          text-align: left;
        }
      }
    </style>
  </head>

  <body>
    <h1>Student Updates</h1>
    <p class="subtitle">Select a student to view their Airtable records.</p>

    <div class="filter-bar">
      <label for="studentFilter">Filter by student</label>
      <select id="studentFilter" disabled>
        <option>Loading students...</option>
      </select>
    </div>

    <div id="records">Loading Airtable data...</div>

    <script src="scripts/script.js"></script>
  </body>
</html>
